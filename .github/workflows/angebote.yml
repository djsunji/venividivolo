name: Angebote aktualisieren

on:
  schedule:
    - cron: "0 4 * * *"   # täglich um 4 Uhr UTC
  workflow_dispatch:       # zusätzlich von Hand startbar (Actions › Angebote aktualisieren › Run workflow)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Feed holen und offers.json schreiben
        env:
          FEED_URLS: ${{ secrets.FEED_URLS }}
        run: node scripts/import-feed.mjs
      - name: Änderungen speichern
        run: |
          git config user.name "angebote-bot"
          git config user.email "angebote-bot@users.noreply.github.com"
          git add offers.json
          git diff --cached --quiet || git commit -m "Angebote aktualisiert"
          git push
