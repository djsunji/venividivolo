<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Veni Vidi Volo: Reiseangebote swipen wie bei Tinder.">
<link rel="icon" type="image/png" href="logo-mark.png">
<title>Veni Vidi Volo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style>
/* Layout: one phone-sized app column (deck / gemerkt / filter tabs) with a boarding-pass detail sheet sliding over it. */
:root {
  --bg: #EDE4D1;
  --surface: #FBF7EE;
  --surface-2: #F3EBDA;
  --ink: #2B1D14;
  --muted: #7B6652;
  --line: #DACAAC;
  --accent: #9E1B1E;
  --accent-ink: #FFF6E3;
  --like: #5E7F2C;
  --nope: #9E1B1E;
  --gold: #B8862B;
  --purple: #4E1F52;
  --vein: rgba(140, 110, 70, .13);
  --shadow: 0 18px 40px -18px rgba(60, 35, 15, .5);
  --display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --body: "EB Garamond", "Garamond", "Georgia", serif;
  --mono: "Cinzel", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17100D; --surface: #241914; --surface-2: #2E2019; --ink: #F1E5CC; --muted: #BBA486;
    --line: #4A3628; --accent: #D2483A; --accent-ink: #1A0B07; --like: #93B95A; --nope: #E05A4B;
    --gold: #D9AE52; --purple: #8A4C90; --vein: rgba(217, 174, 82, .07);
    --shadow: 0 18px 40px -18px rgba(0,0,0,.85); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17100D; --surface: #241914; --surface-2: #2E2019; --ink: #F1E5CC; --muted: #BBA486;
  --line: #4A3628; --accent: #D2483A; --accent-ink: #1A0B07; --like: #93B95A; --nope: #E05A4B;
  --gold: #D9AE52; --purple: #8A4C90; --vein: rgba(217, 174, 82, .07);
  --shadow: 0 18px 40px -18px rgba(0,0,0,.85); color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; overflow: clip; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; padding-inline: 16px; position: relative; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 10px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; display: flex; align-items: baseline; gap: 2px; }
.brand b { color: var(--accent); }
.hright { display: flex; align-items: center; gap: 10px; min-width: 0; }
.themebtn { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; box-shadow: 0 4px 12px -6px rgba(0,0,0,.3); }
.themebtn svg { width: 20px; height: 20px; }
.themebtn .i-sun { display: none; color: #FFC24A; }
.themebtn .i-moon { color: #6D5BFF; }
.is-dark .themebtn .i-sun { display: block; } .is-dark .themebtn .i-moon { display: none; }
.summary { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.35; min-width: 0; }
.summary strong { color: var(--ink); font-weight: 600; }

main { flex: 1; min-height: 0; position: relative; overflow: hidden; overflow: clip; margin-inline: -16px; padding-inline: 16px; }
.view { position: absolute; inset: 0 16px; display: flex; flex-direction: column; }
.view[hidden] { display: none !important; }

/* ---------- Deck ---------- */
.deck { position: relative; flex: 1; min-height: 0; margin-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.card { border: 1px solid rgba(255,255,255,.12); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fact { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(8px); }
.fact svg { width: 14px; height: 14px; opacity: .9; }
.pricetag { position: absolute; right: 16px; top: 26px; z-index: 3; text-align: right; color: #fff; }
.pricetag small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .85; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.pricetag b { display: inline-block; margin-top: 3px; font-family: var(--display); font-weight: 800; font-size: 22px; padding: 4px 12px; border-radius: 12px; background: var(--accent); color: #fff; box-shadow: 0 8px 20px -8px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
.ambient { display: none; position: fixed; inset: -15%; z-index: 0; filter: blur(50px) saturate(1.3); opacity: .45; pointer-events: none; transition: opacity .4s; }
.ambient svg { width: 100%; height: 100%; }
.app { z-index: 1; }
.card {
  position: absolute; inset: 0; border-radius: 22px; overflow: hidden; background: var(--surface);
  box-shadow: var(--shadow); touch-action: none; user-select: none; -webkit-user-select: none;
  display: flex; flex-direction: column; will-change: transform;
  transition: transform .35s cubic-bezier(.2,.8,.3,1), opacity .35s;
}
.card.dragging { transition: none; }
.card .art { position: relative; flex: 1; min-height: 0; }
.card .ph { position: absolute; inset: 0; opacity: 0; transition: opacity .18s; }
.card .ph.on { opacity: 1; }
.card .ph svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.card .art::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(6,10,20,.35) 0, transparent 14%, transparent 38%, rgba(6,10,20,.55) 58%, rgba(6,10,20,.94) 100%); }
.bars { position: absolute; top: 10px; left: 12px; right: 12px; z-index: 3; display: flex; gap: 5px; }
.bars span { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.35); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.bars span.on { background: #fff; }
.card .cap { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.card.bump-l { animation: bumpL .25s; } .card.bump-r { animation: bumpR .25s; }
@keyframes bumpL { 50% { transform: perspective(800px) rotateY(-5deg); } }
@keyframes bumpR { 50% { transform: perspective(800px) rotateY(5deg); } }
.card .over { position: absolute; left: 18px; right: 18px; bottom: 124px; color: #fff; z-index: 2; display: grid; gap: 4px; }
.card .place { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 11vw, 48px); text-shadow: 0 2px 16px rgba(0,0,0,.35); line-height: 1; letter-spacing: -.02em; text-wrap: balance; }
.card .country { font-size: 14px; opacity: .9; font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11.5px; font-weight: 600; letter-spacing: .02em; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.18); color: #fff; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.28); }
.card .meta-old { display: grid; grid-template-columns: repeat(3, 1fr); padding: 12px 16px 14px; gap: 8px; background: var(--surface); }
.meta div { min-width: 0; }
.meta small svg, .badge-lm svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; }
.badge-lm.right { display: flex; align-items: center; }
.meta small { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.meta span { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meta .price span { color: var(--accent); }
.stamp {
  position: absolute; top: 26px; z-index: 3; font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: .06em;
  padding: 4px 14px; border: 5px solid currentColor; border-radius: 10px; opacity: 0; pointer-events: none; background: rgba(255,255,255,.12);
}
.stamp.like { left: 20px; color: #3BE3A2; transform: rotate(-14deg); }
.stamp.nope { right: 20px; color: #FF6B73; transform: rotate(14deg); }
.badge-lm { position: absolute; top: 26px; left: 16px; z-index: 2; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 9px; border-radius: 6px; }
.badge-lm.right { left: 16px; right: auto; background: rgba(6,14,20,.55); color: #fff; }

.actions { position: absolute; left: 0; right: 0; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; justify-content: center; align-items: center; gap: 22px; pointer-events: none; }
.actions .round { pointer-events: auto; }
main:has(.sheet.open) .actions { opacity: 0; visibility: hidden; }
.actions { transition: opacity .2s, visibility .2s; }
.round { --ring: linear-gradient(135deg, #fff, #fff); width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; position: relative;
  border: 3px solid transparent; background: linear-gradient(rgba(12,16,28,.62), rgba(12,16,28,.62)) padding-box, var(--ring) border-box;
  backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 12px 30px -8px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);
  transition: transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s, background .15s; }
.round svg { width: 42px; height: 42px; position: relative; z-index: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
.round:hover { transform: scale(1.08); }
.round:active { transform: scale(.9); }
.round.nope { --ring: linear-gradient(135deg, #FF8A4C, #FF4458 55%, #E01E5A); --glow: rgba(255, 68, 88, .7); }
.round.like { --ring: linear-gradient(135deg, #B8F55A, #2BD99A 55%, #10B9B0); --glow: rgba(43, 217, 154, .75); }
.round.nope { background: #FFFFFF; border: 0; color: #E5484D; box-shadow: 0 12px 28px -10px rgba(0,0,0,.6); backdrop-filter: none; }
.round.nope svg path { stroke: #E5484D; }
.round.like { background: #0FA97A; border: 0; box-shadow: 0 12px 28px -10px rgba(0,0,0,.6); backdrop-filter: none; }
.round.like svg path { fill: #FFFFFF; }
.round.small { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); }
.round.nope.hot { background: #E5484D; box-shadow: 0 0 0 6px rgba(229,72,77,.3), 0 16px 40px -6px rgba(229,72,77,.7); }
.round.like.hot { background: #0FA97A; box-shadow: 0 0 0 6px rgba(15,169,122,.3), 0 16px 40px -6px rgba(15,169,122,.7); }
.round.hot-old { background: var(--ring) padding-box, var(--ring) border-box; box-shadow: 0 0 0 6px color-mix(in srgb, var(--glow) 35%, transparent), 0 16px 40px -6px var(--glow); }
.round.nope.hot svg path { stroke: #fff; }
.round.like::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid #2BD99A; opacity: 0; }
.round.like.pulse::after { animation: ring .6s ease-out; }
@keyframes ring { from { opacity: .9; transform: scale(.9); } to { opacity: 0; transform: scale(1.6); } }
.round.small { --ring: linear-gradient(135deg, #5FD4FF, #3B82F6 60%, #6D5BFF); width: 56px; height: 56px; color: #fff; }
.round.small svg { width: 26px; height: 26px; }
.hint-old { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 6px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }

.empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; border: 2px dashed var(--line); border-radius: 22px; }
.empty h2 { font-family: var(--display); font-size: 24px; margin: 0 0 8px; text-wrap: balance; }
.empty p { color: var(--muted); margin: 0 0 18px; max-width: 30ch; margin-inline: auto; line-height: 1.5; }
.btn { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ---------- Gemerkt list ---------- */
.list { overflow-y: auto; grid-template-columns: minmax(0, 1fr); display: grid; gap: 10px; padding-bottom: 16px; align-content: start; }
.row { display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px; text-align: left; width: 100%; }
.row .thumb { width: 84px; height: 72px; border-radius: 10px; overflow: hidden; position: relative; }
.row .thumb svg { width: 100%; height: 100%; display: block; }
.row .t { min-width: 0; }
.row .t b { font-family: var(--display); font-size: 17px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t span { font-size: 12.5px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .p { text-align: right; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; padding-right: 6px; }
.row .p small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; }
.section-h { display: flex; justify-content: space-between; align-items: baseline; padding-block: 4px 10px; gap: 10px; }
.section-h h2 { font-family: var(--display); font-size: 22px; margin: 0; }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 10px; align-self: flex-start; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ---------- Filter ---------- */
.filter { overflow-x: hidden; overflow-y: auto; grid-template-columns: minmax(0, 1fr); padding-bottom: 20px; display: grid; gap: 22px; align-content: start; }
.fgroup { display: grid; gap: 10px; }
.fgroup > label, .fgroup > .lbl { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.fgroup .lbl output { color: var(--ink); font-family: var(--mono); letter-spacing: 0; text-transform: none; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 13px; font-size: 13.5px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.steppers { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.stepper { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stepper div small { display: block; font-size: 11px; color: var(--muted); }
.stepper div b { font-size: 15px; }
.stepper .ctl { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); font-size: 18px; line-height: 1; display: grid; place-items: center; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { font-family: var(--mono); font-weight: 600; font-size: 16px; min-width: 1.2ch; text-align: center; }
.kids-ages { display: flex; flex-wrap: wrap; gap: 8px; }
.kids-ages label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
select, input[type=date] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-width: 0; width: 100%; }
.dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dates label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.sticky-cta { position: sticky; bottom: 0; padding-block: 12px 4px; background: linear-gradient(transparent, var(--bg) 30%); }
.sticky-cta .btn { width: 100%; font-size: 16px; }

/* ---------- Bottom nav ---------- */
nav.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; margin-bottom: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; }
nav.tabs button { border: 0; background: none; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); position: relative; }
nav.tabs button svg { width: 18px; height: 18px; flex: none; }
nav.tabs button[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: 0 2px 8px -3px rgba(16,32,43,.3); }
nav.tabs button[aria-current="page"] svg { color: var(--accent); }
.count { position: static; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.count:empty { display: none; }

/* ---------- Detail sheet ---------- */
.sheet { position: absolute; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.3,1); }
.sheet.open { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.2,.8,.3,1), visibility 0s; }
.sheet:not(.open) { visibility: hidden; transition: transform .35s cubic-bezier(.2,.8,.3,1), visibility 0s .35s; }
.sheet .hero { position: relative; height: 300px; }
.strip { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip > div { flex: 0 0 100%; scroll-snap-align: start; position: relative; }
.strip svg { width: 100%; height: 100%; display: block; }
.hcap { position: absolute; right: 12px; top: 16px; z-index: 1; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: rgba(6,14,20,.5); padding: 5px 9px; border-radius: 6px; }
.gnav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(6,14,20,.5); color: #fff; display: grid; place-items: center; backdrop-filter: blur(6px); }
.gnav svg { width: 22px; height: 22px; }
.gnav.prev { left: 12px; } .gnav.next { right: 12px; }
.strip { cursor: pointer; }
.dots { position: absolute; left: 0; right: 0; bottom: 48px; display: flex; justify-content: center; gap: 6px; }
.dots button { width: 8px; height: 8px; padding: 0; border-radius: 50%; border: 0; background: rgba(255,255,255,.5); }
.dots button.on { background: #fff; width: 22px; border-radius: 4px; }
.sheet .close { position: absolute; top: 12px; left: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(6,14,20,.55); color: #fff; display: grid; place-items: center; }
.sheet .body { padding: 0 16px 24px; display: grid; gap: 18px; margin-top: -36px; position: relative; }
.pass { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.pass .head { padding: 18px 18px 14px; display: grid; gap: 6px; }
.pass .head h1 { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.05; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.pass .head .sub { color: var(--muted); font-size: 14px; }
.stars { color: #E9A23B; letter-spacing: 2px; font-size: 14px; }
.route { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 14px 18px; border-top: 1px dashed var(--line); }
.iata { font-family: var(--mono); font-weight: 600; font-size: 26px; line-height: 1; }
.iata small { display: block; font-family: var(--body); font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 4px; }
.route .line { position: relative; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 11px); }
.route .line span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--surface); padding: 0 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.perf { position: relative; height: 0; border-top: 2px dashed var(--line); margin-inline: 14px; }
.perf::before, .perf::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
.perf::before { left: -26px; } .perf::after { right: -26px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; padding: 16px 18px 18px; }
.kv div { min-width: 0; }
.kv small { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
.kv b { font-weight: 600; font-variant-numeric: tabular-nums; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
.box h3 { margin: 0 0 10px; font-family: var(--display); font-size: 18px; }
.box p { margin: 0; line-height: 1.55; color: var(--muted); }
.incl { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.incl li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; line-height: 1.4; }
.incl li svg { width: 18px; height: 18px; color: var(--like); margin-top: 1px; }
.pricing { display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.pricing div { display: flex; justify-content: space-between; gap: 12px; }
.pricing .tot { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; font-weight: 700; font-size: 18px; }
.pricing .tot span:last-child { color: var(--accent); }
.bookbar { position: sticky; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.bookbar .pp small { display: block; color: var(--muted); font-size: 11.5px; }
.bookbar .pp b { font-size: 19px; font-variant-numeric: tabular-nums; }
.bookbar a { text-decoration: none; text-align: center; }
.bookbar { grid-template-columns: 1fr auto auto; }
.chatbtn { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; color: var(--ink); position: relative; }
.chatbtn svg { width: 22px; height: 22px; }
.chatbtn .dot { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--like); border: 2px solid var(--surface-2); }
.advisor { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-family: var(--display); color: #fff; background: linear-gradient(135deg, #5FD4FF, #3B82F6 60%, #6D5BFF); position: relative; flex: none; }
.avatar::after { content: ""; position: absolute; right: 0; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: #2BD99A; border: 2px solid var(--surface); }
.advisor b { display: block; } .advisor small { color: var(--muted); font-size: 12.5px; }
.advisor .btn { padding: 10px 14px; }
.chat { position: absolute; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.3,1); visibility: hidden; }
.chat.open { transform: none; visibility: visible; }
.chat header { display: grid; grid-template-columns: auto auto 1fr; gap: 12px; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.chat header button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.chat header b { display: block; font-size: 15px; } .chat header small { color: var(--muted); font-size: 12px; }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 80%; padding: 10px 13px; border-radius: 18px; line-height: 1.45; font-size: 14.5px; white-space: pre-line; }
.msg.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.me { align-self: flex-end; background: #3E7BFA; color: #fff; border-bottom-right-radius: 6px; }
.msg.typing { display: flex; gap: 4px; padding: 14px; }
.msg.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.msg.typing i:nth-child(2) { animation-delay: .15s; } .msg.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.demo-note { align-self: center; font-size: 11.5px; color: var(--muted); text-align: center; max-width: 34ch; line-height: 1.4; }
.quick { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
.quick button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.composer input { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 11px 16px; min-width: 0; }
.composer button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3E7BFA; color: #fff; display: grid; place-items: center; }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.toast { position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; transition: .25s; pointer-events: none; z-index: 30; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%); }

/* ---------- Match ---------- */
[hidden] { display: none !important; }
.match { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(circle at 50% 40%, rgba(240, 83, 63, .45), rgba(15, 27, 45, .94) 68%); backdrop-filter: blur(8px); text-align: center; color: #fff; }
.match canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.match .inner { position: relative; display: grid; gap: 18px; justify-items: center; max-width: 420px; width: 100%; animation: pop .55s cubic-bezier(.2,1.4,.4,1) both; }
.match h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(54px, 17vw, 84px); line-height: .9; letter-spacing: -.03em; transform: rotate(-6deg);
  color: #FFD36B; text-wrap: balance; }
.match .pair { display: flex; align-items: center; justify-content: center; margin-block: 8px; }
.match .pic { width: 128px; height: 128px; border-radius: 50%; overflow: hidden; border: 4px solid #fff; box-shadow: 0 14px 30px rgba(0,0,0,.45); }
.match .pic svg { width: 100%; height: 100%; display: block; }
.match .pic.you { display: grid; place-items: center; background: #0FA97A; margin-left: -22px; }
.match .pic.you svg { width: 60px; height: 60px; }
.match p { margin: 0; font-size: 17px; line-height: 1.45; opacity: .95; max-width: 30ch; }
.match p b { font-weight: 700; }
.match .btns { display: grid; gap: 10px; width: 100%; max-width: 320px; margin-top: 6px; }
.match .btn { font-size: 16px; padding: 15px; border-radius: 999px; }
.match .btn.primary { background: #F0533F; color: #fff; }
.match .btn.ghost { color: #fff; border-color: rgba(255,255,255,.5); }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }


/* ---------- Roma: Marmor, Gold, Kaiserrot ---------- */
body { font-size: 16px;
  background:
    linear-gradient(118deg, transparent 38%, var(--vein) 38.6%, transparent 40.5%),
    linear-gradient(152deg, transparent 61%, var(--vein) 61.4%, transparent 62.8%),
    linear-gradient(74deg, transparent 72%, var(--vein) 72.3%, transparent 73.4%),
    radial-gradient(1100px 600px at 12% -10%, color-mix(in srgb, var(--surface) 75%, transparent), transparent 62%),
    radial-gradient(900px 700px at 105% 110%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 60%),
    var(--bg); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline-color: var(--gold); }
header.top { padding-block: 12px 6px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: .04em; align-items: center; gap: 8px; color: var(--ink); line-height: 1; }
.brand .laurel { width: 38px; height: 38px; flex: none; color: var(--gold); }
.brand .bt { display: grid; gap: 4px; }
.brand i { font-style: normal; color: var(--gold); margin-inline: .22em; }
.brand b { color: var(--accent); font-weight: 800; }
.brand small { font-family: var(--display); font-size: 9.5px; letter-spacing: .2em; color: var(--muted); font-weight: 600; white-space: nowrap; }
.meander { display: block; width: 100%; height: 12px; color: var(--gold); opacity: .8; margin-bottom: 10px; flex: none; }
.summary { font-size: 13px; font-style: italic; }
.themebtn { border-radius: 6px; border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }
.themebtn .i-moon { color: var(--purple); } .themebtn .i-sun { color: var(--gold); }

nav.tabs { border-radius: 6px; border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
nav.tabs button { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; border-radius: 4px; }
nav.tabs button[aria-current="page"] { color: var(--accent); box-shadow: inset 0 -2px 0 var(--gold), 0 2px 8px -3px rgba(60,35,15,.3); }
.count { background: var(--gold); color: #fff; font-family: var(--body); }

/* Karte wie ein gerahmtes Fresko */
.card { border-radius: 12px; border: 1px solid color-mix(in srgb, var(--gold) 70%, transparent); background: #1C130E; }
.card::before { content: ""; position: absolute; inset: 7px; z-index: 4; pointer-events: none; border: 1.5px solid rgba(233, 196, 106, .75); border-radius: 7px; box-shadow: inset 0 0 0 3px rgba(20,12,8,.18), inset 0 0 0 4px rgba(233,196,106,.35); }
.bars { top: 16px; left: 18px; right: 18px; }
.bars span { height: 3px; border-radius: 1px; }
.bars span.on { background: #F3D27A; }
.badge-lm, .badge-lm.right { top: 30px; left: 20px; border-radius: 3px; font-family: var(--display); font-size: 10.5px; letter-spacing: .1em; border: 1px solid rgba(233,196,106,.5); }
.pricetag { top: 28px; right: 20px; }
.pricetag small { font-family: var(--display); letter-spacing: .14em; }
.pricetag b { font-family: var(--display); font-weight: 700; border-radius: 4px; background: var(--accent); border: 1.5px solid #E9C46A; color: #FFF6E3; }
.card .cap { font-family: var(--display); letter-spacing: .18em; color: #F3D27A; opacity: 1; }
.card .place { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 9.2vw, 42px); letter-spacing: .02em; }
.card .country { font-size: 16px; font-style: italic; }
.fact { border-radius: 4px; font-size: 14px; border-color: rgba(233,196,106,.35); }
.tag { border-radius: 3px; font-family: var(--display); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; border-color: rgba(233,196,106,.4); }
.stamp { font-family: var(--display); font-weight: 800; border-style: double; border-width: 7px; border-radius: 4px; letter-spacing: .12em; top: 34px; }
.stamp.like { color: #F3D27A; } .stamp.nope { color: #FF7A66; }
.card .art::after { background: linear-gradient(180deg, rgba(20,10,6,.4) 0, transparent 15%, transparent 38%, rgba(25,12,6,.55) 58%, rgba(22,10,5,.95) 100%); }

/* Knöpfe: Marmor-Medaillon, Kaiserrot mit Gold, Purpur */
.round.nope { background: radial-gradient(circle at 35% 30%, #FFFFFF, #F1E8D6 60%, #DCCBA8); border: 3px solid #C9A04A; }
.round.nope svg path { stroke: #9E1B1E; }
.round.like { background: radial-gradient(circle at 35% 30%, #C9352D, #9E1B1E 55%, #6E0F12); border: 3px solid #E0B85A; }
.round.like svg path { fill: #F6D77C; }
.round.like::after { border-color: #E0B85A; }
.round.small { background: radial-gradient(circle at 35% 30%, #6E3474, #4E1F52 60%, #33123A); border: 2px solid #D9AE52; color: #F6D77C; }
.round.nope.hot { background: #9E1B1E; box-shadow: 0 0 0 6px rgba(158,27,30,.3), 0 16px 40px -6px rgba(158,27,30,.7); }
.round.nope.hot svg path { stroke: #FFF6E3; }
.round.like.hot { background: #B3261E; box-shadow: 0 0 0 6px rgba(224,184,90,.4), 0 16px 40px -6px rgba(224,184,90,.8); }

/* Allgemein */
.btn { border-radius: 6px; font-family: var(--display); font-weight: 700; letter-spacing: .06em; }
.btn:not(.ghost) { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 70%, transparent), 0 6px 16px -8px rgba(60,20,10,.6); }
.empty { border-radius: 10px; border-color: color-mix(in srgb, var(--gold) 50%, var(--line)); }
.empty h2, .section-h h2, .box h3 { font-family: var(--display); font-weight: 700; letter-spacing: .03em; }
.section-h h2::after { content: ""; display: block; width: 46px; height: 2px; margin-top: 6px; background: linear-gradient(90deg, var(--gold), transparent); }
.linkbtn { font-style: italic; font-size: 14px; }
.seg { border-radius: 4px; }
.seg button { font-family: var(--display); font-size: 11.5px; letter-spacing: .08em; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.row { border-radius: 8px; }
.row .thumb { border-radius: 40px 40px 4px 4px; border: 1.5px solid color-mix(in srgb, var(--gold) 70%, transparent); }
.row .t b { font-family: var(--display); font-weight: 700; font-size: 16px; }
.row .t span { font-size: 14px; font-style: italic; }
.row .p { font-family: var(--display); }
.fgroup > label, .fgroup > .lbl { font-family: var(--display); font-size: 11.5px; letter-spacing: .14em; color: var(--muted); }
.chip { border-radius: 4px; font-size: 15px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--gold); }
input[type=range] { accent-color: var(--accent); }
.stepper, select, input[type=date] { border-radius: 6px; }
.stepper div b { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .04em; }
.stepper button { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }

/* Angebot */
.sheet .close, .gnav, .hcap { border: 1px solid rgba(233,196,106,.5); }
.hcap { border-radius: 3px; font-family: var(--display); }
.dots button.on { background: #F3D27A; }
.pass { border-radius: 10px; border-top: 4px solid var(--accent); box-shadow: var(--shadow), inset 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent); }
.pass .head h1 { font-family: var(--display); font-weight: 700; letter-spacing: .02em; }
.pass .head .sub { font-style: italic; font-size: 15px; }
.stars { color: var(--gold); }
.iata { font-weight: 700; letter-spacing: .04em; }
.route .line { background: repeating-linear-gradient(90deg, var(--gold) 0 6px, transparent 6px 11px); }
.route, .perf { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
.kv small, .bookbar .pp small { font-family: var(--display); letter-spacing: .12em; }
.kv b { font-weight: 600; font-size: 16px; }
.box { border-radius: 10px; }
.box h3::after { content: ""; display: block; width: 36px; height: 2px; margin-top: 6px; background: linear-gradient(90deg, var(--gold), transparent); }
.pricing .tot span:last-child, .bookbar .pp b { font-family: var(--display); }
.chatbtn { border-radius: 6px; }
.avatar { background: radial-gradient(circle at 35% 30%, #6E3474, #4E1F52); border: 1.5px solid #D9AE52; color: #F6D77C; }
.chat header b { font-family: var(--display); letter-spacing: .03em; }
.msg { font-size: 16px; border-radius: 14px; }
.msg.me { background: var(--accent); color: #FFF6E3; }
.quick button { border-radius: 4px; font-size: 14px; }
.composer button { background: var(--accent); }
.composer input { border-radius: 6px; }
.toast { border-radius: 4px; font-family: var(--display); letter-spacing: .04em; }

/* Match: Triumph in Purpur und Gold */
.match { background: radial-gradient(circle at 50% 38%, rgba(158, 27, 30, .55), rgba(40, 12, 38, .95) 70%); }
.match h2 { font-family: var(--display); font-weight: 800; transform: none; font-size: clamp(34px, 10.5vw, 58px); line-height: 1.05; letter-spacing: .03em; color: #F3D27A; text-shadow: 0 3px 18px rgba(0,0,0,.45); }
.match h2 small { display: block; font-size: 15px; letter-spacing: .32em; text-transform: uppercase; color: #FFF6E3; opacity: .85; margin-bottom: 10px; font-weight: 600; }
.match .pic { border-radius: 64px 64px 8px 8px; border: 3px solid #E0B85A; }
.match .pic.you { background: radial-gradient(circle at 35% 30%, #C9352D, #9E1B1E 55%, #6E0F12); }
.match .pic.you svg path { fill: #F6D77C; }
.match p { font-size: 18px; }
.match .btn.primary { background: #9E1B1E; color: #FFF6E3; }
.match .btn.ghost { border-color: rgba(233,196,106,.6); }
.match .btn { border-radius: 6px; }
@media (min-width: 1000px) {
  .brand { font-size: 26px; } .brand .laurel { width: 48px; height: 48px; } .brand small { font-size: 11px; }
  #v-filter, #v-saved { border-radius: 10px; border-top: 3px solid var(--gold); }
  .sheet { border-radius: 14px; } .chat { border-radius: 12px; }
  .card .place { font-size: 46px; }
}

@media (min-width: 1000px) { .summary { white-space: nowrap; } }
@media (max-width: 999px) { .summary .sd { display: none; } .summary { max-width: 72px; line-height: 1.2; } }
.bookbar .pp small { white-space: nowrap; font-size: 10.5px; }
.bookbar .pp b { white-space: nowrap; }
.bookbar .btn { font-size: 13.5px; letter-spacing: .03em; padding: 12px 14px; }
.match h2 .l { display: block; white-space: nowrap; }
.match h2 { font-size: clamp(30px, 9.6vw, 58px); }
/* ---------- Schlichter ---------- */
body { background: var(--bg); }
.meander { opacity: .35; height: 10px; }
.card::before { display: none; }
.card { border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); }
.badge-lm, .badge-lm.right, .pricetag b, .fact, .tag, .hcap, .sheet .close, .gnav { border: 0; }
.fact { background: rgba(255,255,255,.12); backdrop-filter: none; }
.tag { background: transparent; padding-inline: 0; opacity: .8; }
.stamp { border-style: solid; border-width: 4px; }
.round.nope { background: #FBF7EE; border: 2px solid #D9C9A6; }
.round.like { background: #9E1B1E; border: 0; }
.round.small { background: #4E1F52; border: 0; }
.btn:not(.ghost) { box-shadow: none; }
.section-h h2::after, .box h3::after { display: none; }
.pass { border-top-width: 3px; box-shadow: var(--shadow); }
.row .thumb { border: 0; }
.chip[aria-pressed="true"] { border-color: var(--accent); }
.match { background: rgba(30, 12, 18, .94); }
.match .pic { border-width: 2px; }
/* ---------- Logo-Gold ---------- */
:root { --gold-grad: linear-gradient(180deg, #F6CF7A 0%, #D9A048 45%, #A8691F 80%, #8A5418 100%); --accent: #A8691F; --accent-ink: #2B1A08; --gold: #B8802E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #E0A84E; --accent-ink: #1E1206; --gold: #D9A04A; } }
:root[data-theme="dark"] { --accent: #E0A84E; --accent-ink: #1E1206; --gold: #D9A04A; }
.brand { margin: 0; display: grid; gap: 5px; justify-items: start; font-size: inherit; }
.brand .logo { display: block; width: min(250px, 58vw); height: auto; filter: drop-shadow(0 2px 3px rgba(80, 45, 10, .25)); }
.brand small { font-family: var(--display); font-size: 9.5px; letter-spacing: .24em; color: var(--muted); font-weight: 600; padding-left: 3px; }
.btn:not(.ghost), .pricetag b, .chip[aria-pressed="true"], .seg button[aria-pressed="true"], .count { background: var(--gold-grad); color: #2B1A08; border-color: #A8691F; text-shadow: 0 1px 0 rgba(255,235,190,.5); }
.pricetag b { box-shadow: 0 8px 20px -8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,240,200,.7); }
.btn:not(.ghost) { box-shadow: inset 0 1px 0 rgba(255,240,200,.7), 0 6px 16px -8px rgba(90,50,10,.6); }
nav.tabs button[aria-current="page"], nav.tabs button[aria-current="page"] svg { color: #A8691F; }
:root[data-theme="dark"] nav.tabs button[aria-current="page"], :root[data-theme="dark"] nav.tabs button[aria-current="page"] svg { color: #E0A84E; }
.round.like { background: var(--gold-grad); box-shadow: inset 0 2px 0 rgba(255,240,200,.7), 0 12px 28px -10px rgba(0,0,0,.6); }
.round.like svg path { fill: #FFF8E8; }
.round.like svg { filter: drop-shadow(0 1px 2px rgba(90,50,10,.6)); }
.round.like.hot { background: var(--gold-grad); box-shadow: 0 0 0 6px rgba(224,168,78,.35), 0 16px 40px -6px rgba(224,168,78,.8); }
.round.small { background: #2E1F14; color: #E8B860; border: 1.5px solid #B8802E; }
.round.nope { border-color: #D9B877; }
.avatar { background: #2E1F14; color: #E8B860; border-color: #B8802E; }
.msg.me, .composer button { background: #A8691F; color: #FFF8E8; }
.pass { border-top-color: #C88A32; }
.match { background: radial-gradient(circle at 50% 40%, rgba(120, 72, 20, .55), rgba(18, 11, 6, .96) 70%); }
.match h2 { display: grid; justify-items: center; }
.match .mlogo { width: min(380px, 88vw); height: auto; filter: drop-shadow(0 4px 14px rgba(0,0,0,.5)); }
.match .pic.you { background: var(--gold-grad); }
.match .pic.you svg path { fill: #FFF8E8; }
.match .btn.primary { background: var(--gold-grad); color: #2B1A08; }
.stamp.like { color: #F3C46E; }
.card .cap, .bars span.on { color: #F3C46E; }
@media (min-width: 1000px) { .brand .logo { width: 340px; } .brand small { font-size: 11px; } }
/* ---------- Modern ---------- */

function attachDrag(el, o) {
  let sx = 0, sy = 0, dx = 0, dy = 0, down = false;
  const like = el.querySelector(".stamp.like"), nope = el.querySelector(".stamp.nope");
  el.addEventListener("pointerdown", e => { down = true; sx = e.clientX; sy = e.clientY; dx = dy = 0; el.setPointerCapture(e.pointerId); el.classList.add("dragging"); });
  el.addEventListener("pointermove", e => {

    like.style.opacity = Math.max(0, Math.min(1, dx / 90)); nope.style.opacity = Math.max(0, Math.min(1, -dx / 90)); react(dx);
  });
  const end = e => {

      if (e.type === "pointerup" && e.clientY < art.bottom) { const x = (e.clientX - art.left) / art.width; if (x < 1 / 3) stepPhoto(el, -1); else if (x > 2 / 3) stepPhoto(el, 1); else openDetail(o); }

  };

}

function stepPhoto(el, d) {

function react(dx) {

function answer(q) {

  const span = o.from === o.until ? `nur am ${fmtDate(d0)}` : `zwischen ${fmtDate(d0)} und ${fmtDate(d1)}`;
  if (/verfüg|frei|platz|noch/.test(t)) return `Die Verfügbarkeit prüft ${ag.name} live, wenn du auf «Buchen» tippst. Vorgeschlagen ist Abreise am ${fmtDate(dep)}, Rückreise am ${fmtDate(ret)}.`;
  if (/inbegriffen|inklusive|enthalten|dabei/.test(t)) return `Im Preis sind enthalten:\n• ${o.incl.join("\n• ")}`;
  if (/datum|verschieb|andere|später|früher|termin|wann/.test(t)) return `Laut ${ag.name} ist die Abreise ${span} möglich. Dein Wunschdatum wählst du direkt beim Anbieter.`;

  if (/gepäck|koffer|kg/.test(t)) return `Wie viel Gepäck inbegriffen ist, hängt von der Fluggesellschaft ab. Das siehst du bei ${ag.name} vor dem Buchen.`;
  if (/rabatt|günstig|preis|billig|teuer|kost/.test(t)) return `Der Preis für deine Gruppe liegt bei ${chf(total(o, f))}. Das ist der Ab-Preis laut ${ag.name}, Stand 8. Oktober 2026. Der genaue Preis kann je nach Datum abweichen.`;
  if (/transfer|flughafen/.test(t)) return o.incl.some(i => /transfer/i.test(i)) ? `Der Transfer vom Flughafen ins Hotel ist inbegriffen.` : `Ob ein Transfer dabei ist, steht in den Angebotsdetails bei ${ag.name}.`;
  if (/hallo|grüezi|hoi|hi\b|guten/.test(t)) return `Hallo! Was möchtest du zum Angebot wissen?`;
  if (/danke|merci/.test(t)) return `Gern geschehen! Wenn du buchen möchtest, kannst du das direkt bei ${ag.name} machen.`;
  return `Gute Frage! Das kläre ich gern für dich ab und melde mich gleich. Schnell beantworten kann ich Fragen zu Verfügbarkeit, Datum, Leistungen, Kindern, Gepäck und Preis.`;
}
function send(text) {
  text = text.trim(); if (!text) return;
  const list = chats[chatCtx.o.id];
  list.push({ me: true, t: text }); renderMsgs(true);
  setTimeout(() => { list.push({ me: false, t: answer(text) }); renderMsgs(); }, 900 + Math.random() * 600);
}
$("#composer").onsubmit = e => { e.preventDefault(); send($("#chat-input").value); $("#chat-input").value = ""; };
$("#chat-close").onclick = closeChat;

/* ================= Filter ================= */
function renderFilter() {
  const d = draft;
  $("#f-types").innerHTML = TYPES.map(t => `<button type="button" class="chip" aria-pressed="${d.types.includes(t)}" data-t="${t}">${t}</button>`).join("");
  const countries = [...new Set(OFFERS.map(o => o.country))].sort((a, b) => a.localeCompare(b, "de"));
  $("#f-countries").innerHTML = `<button type="button" class="chip" aria-pressed="${!d.countries.length}" data-c="">Alle Länder</button>` +
    countries.map(c => `<button type="button" class="chip" aria-pressed="${d.countries.includes(c)}" data-c="${c}">${c}</button>`).join("");
  $("#o-countries").textContent = d.countries.length ? `${d.countries.length} gewählt` : "";
  $("#f-hours").value = d.hours; $("#o-hours").textContent = "bis " + hrs(d.hours);
  $("#o-adults").textContent = d.adults; $("#o-kids").textContent = d.kids;
  $("#ad-minus").disabled = d.adults <= 1; $("#ad-plus").disabled = d.adults >= 6; $("#ki-minus").disabled = d.kids <= 0; $("#ki-plus").disabled = d.kids >= 4;
  $("#kids-ages").innerHTML = Array.from({ length: d.kids }, (_, i) => `<label for="age${i}">Alter Kind ${i + 1}<select id="age${i}" data-i="${i}">${Array.from({ length: 18 }, (_, a) => `<option ${d.ages[i] === a ? "selected" : ""} value="${a}">${a} J.</option>`).join("")}</select></label>`).join("");
  $("#f-from").value = d.from; $("#f-to").value = d.to; $("#f-from").min = iso(TODAY); $("#f-to").min = d.from;
  const n = results(d).length;
  $("#apply").textContent = n ? `${n} Angebot${n === 1 ? "" : "e"} zeigen` : "Keine Angebote mit diesen Filtern";
  $("#apply").disabled = !n;
}
$("#f-types").onclick = e => { const t = e.target.closest("[data-t]")?.dataset.t; if (!t) return; draft.types = draft.types.includes(t) ? draft.types.filter(x => x !== t) : [...draft.types, t]; renderFilter(); };
$("#f-countries").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; const c = b.dataset.c;
  draft.countries = !c ? [] : draft.countries.includes(c) ? draft.countries.filter(x => x !== c) : [...draft.countries, c]; renderFilter(); };
$("#f-hours").oninput = e => { draft.hours = +e.target.value; renderFilter(); };
$("#ad-minus").onclick = () => { draft.adults--; renderFilter(); };
$("#ad-plus").onclick = () => { draft.adults++; renderFilter(); };
$("#ki-minus").onclick = () => { draft.kids--; draft.ages.length = draft.kids; renderFilter(); };
$("#ki-plus").onclick = () => { draft.kids++; draft.ages.push(6); renderFilter(); };
$("#kids-ages").onchange = e => { draft.ages[+e.target.dataset.i] = +e.target.value; };
$("#f-from").onchange = e => { draft.from = e.target.value || iso(TODAY); if (draft.to < draft.from) draft.to = draft.from; renderFilter(); };
$("#f-to").onchange = e => { draft.to = e.target.value || draft.from; renderFilter(); };
$("#reset").onclick = () => { draft = DEFAULTS(); renderFilter(); };
$("#filter-form").onsubmit = e => {
  e.preventDefault(); filters = structuredClone(draft); store.set("filters2", filters);
  seen = []; store.set("seen", seen); buildQueue(); show("deck");
};

/* ================= Navigation ================= */
function updateCount() { $("#count").textContent = liked.length || ""; }
function updateSummary() {
  const f = filters, n = results(f).length;
  const dfmt = s => { const d = new Date(s + "T00:00"); return `${d.getDate()}.${d.getMonth() + 1}.`; };
  $("#summary").innerHTML = `<strong>${queue.length} von ${n}</strong> übrig<span class="sd"><br>${f.adults} Erw.${f.kids ? ` · ${f.kids} Ki.` : ""} · bis ${hrs(f.hours)} · ${dfmt(f.from)}–${dfmt(f.to)}</span>`;
}
const isDesk = () => matchMedia("(min-width: 1000px)").matches;
function show(v) {
  closeDetail();
  for (const k of ["deck", "saved", "filter"]) { $("#v-" + k).hidden = k !== v; $("#t-" + k).toggleAttribute("aria-current", k === v); if (k === v) $("#t-" + k).setAttribute("aria-current", "page"); }
  if (isDesk()) { renderDeck(); renderList(); draft = structuredClone(filters); renderFilter(); return; }
  if (v === "deck") renderDeck();
  if (v === "saved") renderList();
  if (v === "filter") { draft = structuredClone(filters); renderFilter(); }
}
$("#t-deck").onclick = () => show("deck");
$("#t-saved").onclick = () => show("saved");
$("#t-filter").onclick = () => show("filter");
$("#seg-liked").onclick = () => { listMode = "liked"; renderList(); };
$("#seg-all").onclick = () => { listMode = "all"; renderList(); };
$("#clear-saved").onclick = () => { liked = []; store.set("liked", liked); updateCount(); renderList(); };
let wasDesk = isDesk();
addEventListener("resize", () => { if (isDesk() !== wasDesk) { wasDesk = isDesk(); show(wasDesk ? "deck" : "deck"); } });
$("#b-like").onclick = () => decide(true);
$("#b-nope").onclick = () => decide(false);
$("#b-info").onclick = () => queue[0] && openDetail(queue[0]);
document.addEventListener("keydown", e => {
  if (!$("#match").hidden) { if (e.key === "Escape") hideMatch(); return; }
  if ($("#chat").classList.contains("open")) { if (e.key === "Escape") closeChat(); return; }
  if ($("#sheet").classList.contains("open")) { if (e.key === "Escape") closeDetail(); return; }
  if ($("#v-deck").hidden || e.target.closest("input,select")) return;
  if (e.key === "ArrowRight") decide(true); else if (e.key === "ArrowLeft") decide(false); else if (e.key === "ArrowUp" && queue[0]) openDetail(queue[0]);
  else if (e.key === " " && queue[0]) { e.preventDefault(); const c = document.querySelector(`.card[data-id="${queue[0].id}"]`); if (c) stepPhoto(c, c.querySelector(".ph:last-child.on") ? -3 : 1); }
});
let tt; function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1400); }

/* ================= Tag / Nacht ================= */
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function applyTheme(mode) {
  const root = document.documentElement;
  if (mode) root.setAttribute("data-theme", mode); else root.removeAttribute("data-theme");
  const dark = mode ? mode === "dark" : darkMQ.matches;
  document.body.classList.toggle("is-dark", dark);
  $("#theme").setAttribute("aria-label", dark ? "Tagmodus einschalten" : "Nachtmodus einschalten");
}
applyTheme(store.get("theme2", "light"));
$("#theme").onclick = () => { const next = document.body.classList.contains("is-dark") ? "light" : "dark"; store.set("theme2", next); applyTheme(next); };

buildQueue(); updateCount(); renderDeck(); if (isDesk()) show("deck");
</script>

</body>
